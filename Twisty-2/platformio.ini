; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:rpipicow]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
; upload_port = --upload-port
; Use the Earle Philhower Arduino-Pico core
board_build.core = earlephilhower
; Reserve flash for the LittleFS filesystem
board_build.filesystem_size = 0.5m
; Use Adafruit TinyUSB
build_flags =
    -DUSE_TINYUSB
    -DBLUETOOTH
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
; Libraries
lib_deps =
    adafruit/Adafruit TinyUSB Library
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit NeoPixel
    fortyseveneffects/MIDI Library
    bblanchon/ArduinoJson
    https://github.com/tttapa/Control-Surface.git
    hideakitai/ArduinoOSC@^0.6.0
monitor_speed = 115200
